<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f3f3f3;
    padding: 50px;
    font-family: Arial, sans-serif;
}

.bento-grid {
    max-width: 1200px;
    margin: auto;

    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 250px 250px;
    gap: 20px;
}

.card {
    border-radius: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 40px;
    font-weight: bold;
    overflow: hidden;
    position: relative;
}

.card img {
    width: 100%;

    height: 100%;
    object-fit: cover;
}


.content{

    position: absolute;
    bottom: 30px;
    left: 20px;
}

/* Large left card */
.a {
    grid-row: span 2;
    grid-column: span 1;
    background: #4361ee;
}

/* Top right card */
.b {
    grid-column: span 2;
    background: #ef476f;
}

/* Bottom right cards */
.c {
    background: #06d6a0;
    grid-column: span 1;

}

.d {
    background: #ffb703;
}


@media (max-width:768px) {



    .bento-grid {
   
    grid-template-columns: 2fr 1fr 1fr 1fr;
    grid-template-rows: 250px 250px 250px;
    gap: 20px;
}



    .a {
    grid-row: span 1;
    grid-column: span 4;
    background: #4361ee;
}

/* Top right card */
.b {
    grid-column: span 2;
    background: #ef476f;
}

/* Bottom right cards */
.c {
    background: #06d6a0;
    grid-column: span 2;

}

.d {
    background: #ffb703;
    grid-column: span 4;

}
    
}
</style>
</head>

<body>

<div class="bento-grid">

    <div class="card a">
        <img src="{% static 'images/hero_slide_desktop2.png' %}" alt="">
        <div class="content">
            <h3>Women essential</h3>
            <button class="btn">Shop Now</button>
        </div>
    </div>

    <div class="card b">B</div>

    <div class="card c">C</div>

    <div class="card d">D</div>

</div>

  {% include 'footer.html' %}

</body>
</html>
