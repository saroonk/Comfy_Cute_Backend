<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register | COMFY CUTE | Sign In to Your Account</title>

  <!-- Meta Tags for SEO -->
  <meta name="description" content="Sign in to your COMFY CUTE account. Access your orders, saved items, and account settings. New? Create an account today.">
  <meta name="keywords" content="login, register, sign in, account, COMFY CUTE">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FontAwesome 6 Icon Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Bootstrap 5.3.2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

  <!-- ==========================================
       AUTHENTICATION PAGE
       ========================================== -->
  <div class="auth-page">
    <div class="container-fluid h-100">
      <div class="row g-0 h-100">

        <!-- LEFT COLUMN - IMAGE -->
        <div class="col-lg-6 d-none d-lg-flex auth-image-container">
          <img src="{% static 'images/loginimage.webp' %}" alt="COMFY CUTE - Welcome" class="auth-image">
        </div>

        <!-- RIGHT COLUMN - AUTHENTICATION FORM -->
        <div class="col-lg-6 d-flex align-items-center auth-form-container">
          <!-- MOBILE LOGO -->
          <img src="{% static 'images/logo.jpeg' %}" alt="COMFY CUTE Logo" class="auth-mobile-logo">

          <div class="auth-card">

            <!-- TOGGLE TABS -->
            <div class="auth-toggle-wrapper">
              <div class="auth-toggle">
                <button class="auth-toggle-btn active" id="loginToggle" data-mode="login">
                  LOGIN
                </button>
                <button class="auth-toggle-btn" id="registerToggle" data-mode="register">
                  REGISTER
                </button>
                <div class="auth-toggle-indicator"></div>
              </div>
            </div>

            <!-- LOGIN FORM -->
            <div class="auth-form-wrapper active" id="loginForm">
              <h1 class="auth-title">Welcome to COMFY CUTE</h1>
              <p class="auth-subtitle">Sign in to continue shopping your favorite styles.</p>

              <form class="auth-form" id="loginFormElement">

                <!-- Email -->
                <div class="auth-input-group">
                  <label for="loginEmail" class="auth-label">Email Address</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-envelope auth-input-icon"></i>
                    <input
                      type="email"
                      id="loginEmail"
                      class="auth-input"
                      placeholder="Enter your email"
                      required
                    >
                  </div>
                </div>

                <!-- Password -->
                <div class="auth-input-group">
                  <label for="loginPassword" class="auth-label">Password</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input
                      type="password"
                      id="loginPassword"
                      class="auth-input"
                      placeholder="Enter your password"
                      required
                    >
                    <button type="button" class="auth-password-toggle" id="loginPasswordToggle">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <!-- <div class="auth-actions">
                  <label class="auth-checkbox">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember Me</span>
                  </label>
                  <a href="#" class="auth-link-forgot">Forgot Password?</a>
                </div> -->

                <!-- Sign In Button -->
                <button type="submit" class="auth-btn auth-btn-primary">
                  SIGN IN
                </button>

              </form>

              <!-- <p class="auth-footer-text">Welcome</p> -->
            </div>

            <!-- REGISTER FORM -->
            <div class="auth-form-wrapper" id="registerForm">
              <h1 class="auth-title">Create Your Account</h1>
              <p class="auth-subtitle">Join COMFY CUTE and discover premium styles.</p>

              <form class="auth-form" id="registerFormElement">

                <!-- Full Name -->
                <div class="auth-input-group">
                  <label for="registerName" class="auth-label">Full Name</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-user auth-input-icon"></i>
                    <input
                      type="text"
                      id="registerName"
                      class="auth-input"
                      placeholder="Enter your full name"
                      required
                    >
                  </div>
                </div>

                <!-- Email -->
                <div class="auth-input-group">
                  <label for="registerEmail" class="auth-label">Email Address</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-envelope auth-input-icon"></i>
                    <input
                      type="email"
                      id="registerEmail"
                      class="auth-input"
                      placeholder="Enter your email"
                      required
                    >
                  </div>
                </div>

                <!-- Phone Number -->
                <div class="auth-input-group">
                  <label for="registerPhone" class="auth-label">Phone Number</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-phone auth-input-icon"></i>
                    <input
                      type="tel"
                      id="registerPhone"
                      class="auth-input"
                      placeholder="Enter your phone number"
                      required
                    >
                  </div>
                </div>

                <!-- Password -->
                <div class="auth-input-group">
                  <label for="registerPassword" class="auth-label">Password</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input
                      type="password"
                      id="registerPassword"
                      class="auth-input"
                      placeholder="Create a password"
                      required
                    >
                    <button type="button" class="auth-password-toggle" id="registerPasswordToggle">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="auth-input-group">
                  <label for="registerConfirmPassword" class="auth-label">Confirm Password</label>
                  <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input
                      type="password"
                      id="registerConfirmPassword"
                      class="auth-input"
                      placeholder="Confirm your password"
                      required
                    >
                    <button type="button" class="auth-password-toggle" id="registerConfirmPasswordToggle">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Terms & Conditions -->
                <label class="auth-checkbox">
                  <input type="checkbox" id="agreeTerms" required>
                  <span>I agree to the <strong>Terms of Service</strong> and <strong>Privacy Policy</strong></span>
                </label>

                <!-- Create Account Button -->
                <button type="submit" class="auth-btn auth-btn-primary">
                  CREATE ACCOUNT
                </button>

              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3.2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="{% static 'js/login.js' %}"></script>

  {% include 'footer.html' %}

</body>
</html>
